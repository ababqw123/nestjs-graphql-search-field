name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('The release tag must match the stable version in package.json.');
          }
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Build package
        run: npm run build
      - name: Check CommonJS and ESM entry points
        run: |
          node --input-type=commonjs -e "require('@jaeyeong/nestjs-graphql-search-field')"
          node --input-type=module -e "await import('@jaeyeong/nestjs-graphql-search-field')"
      - name: Inspect npm package contents
        run: npm pack --dry-run
      - name: Publish with npm trusted publishing
        run: npm publish --access public
